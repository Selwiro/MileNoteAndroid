<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面走丢了 · 里程志 MileNote</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7FAFB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1316" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('milenote-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .lost {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 0;
      text-align: center;
    }
    .lost-inner { max-width: 560px; }
    .lost img {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      box-shadow: var(--shadow-card);
      margin-bottom: 28px;
    }
    .lost h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.02em;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .lost p { color: var(--muted); font-size: 16px; line-height: 1.9; margin-bottom: 30px; }
    .lost-en { font-size: 14.5px; margin-top: -14px; }
    .lost-en a { color: var(--brand-strong); text-decoration: underline; text-underline-offset: 3px; }
    .lost-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
  </style>
</head>
<body>
  <main class="lost">
    <div class="lost-inner">
      <img src="assets/img/brand-tile.png" width="76" height="76" alt="里程志图标">
      <h1>页面走丢了。</h1>
      <p>这个地址没有对应的页面。你可以回到首页看看产品介绍、界面截图和 APK 下载。</p>
      <p lang="en" class="lost-en">This page doesn't exist. Head back to the homepage for the product tour, screenshots and APK download — or visit the <a href="/MileNoteAndroid/en/">English version</a>.</p>
      <div class="lost-actions">
        <a class="btn btn-primary btn-lg" href="./">回到首页</a>
        <a class="btn btn-quiet btn-lg" href="https://github.com/Selwiro/MileNoteAndroid" rel="noopener">GitHub 仓库</a>
      </div>
    </div>
  </main>
</body>
</html>
