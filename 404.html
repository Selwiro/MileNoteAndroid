<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面未找到 · 里程志 MileNote</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7fafb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1316" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('milenote-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css?v=20261110">
</head>
<body>
  <main class="lost">
    <div class="lost-inner">
      <img src="assets/img/brand-tile.png" width="72" height="72" alt="">
      <h1>页面未找到</h1>
      <p>这个地址没有对应的页面。首页有产品介绍、界面截图和下载入口。</p>
      <p lang="en">This page doesn't exist. The homepage has the product overview, screenshots and download link — or visit the <a href="en/">English version</a>.</p>
      <div class="lost-actions">
        <a class="btn btn-primary" href="./">返回首页</a>
        <a class="btn btn-quiet" href="https://github.com/Selwiro/MileNoteAndroid/releases" rel="noopener">下载 Android 版</a>
      </div>
    </div>
  </main>
</body>
</html>
